<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>جميع إحصائيات الحملات</title>
    <link rel="icon" href="images/cnss_logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/interface3.css" />
  </head>
  <body class="page-results page-admin">
    <div class="composed-backdrop" aria-hidden="true"></div>
    <div class="composed-grid-pattern" aria-hidden="true"></div>

    <header class="composed-topbar">
      <nav class="navbar composed-nav py-2" dir="rtl">
        <div class="container composed-nav-inner">
          <div class="composed-brand">
            <img src="images/cnss_logo.svg" alt="" class="composed-brand-logo" width="44" height="44" decoding="async" />
            <div class="brand-mini-menu" aria-label="Menu">
              <a href="#" class="btn btn-outline-secondary btn-sm composed-menu-btn is-active" aria-current="page">البرامج</a>
              <a href="interface3.html" class="btn btn-outline-secondary btn-sm composed-menu-btn">الإحصائيات</a>
            </div>
          </div>
          <div class="composed-user-panel">
            <div class="composed-user-lines">
              <div id="user-info" class="composed-user-line">--</div>
            </div>
            <a href="my-account.html" class="btn btn-outline-secondary btn-sm composed-menu-btn" id="btn-account"> حسابي </a>
            <button type="button" class="btn btn-outline-secondary btn-sm composed-menu-btn p-0" id="btn-logout"><img src="images/off_icon.svg" alt="Déconnexion" width="32" height="32" /></button>
          </div>
        </div>
      </nav>
    </header>

    <main class="container-fluid composed-main results-main-fluid">
      <div class="row g-4 composed-bento">
        <div class="col-12">
          <div class="card card-custom card-composed card-composed--wide h-100">
            <div class="card-composed-accent card-composed-accent--secondary" aria-hidden="true"></div>
            <div class="card-composed-body p-4 p-lg-4 d-flex flex-column" dir="rtl">
              <div class="composed-card-head mb-3">
                <span class="composed-card-icon composed-card-icon--table" aria-hidden="true"></span>
                <div class="w-100">
                  <div class="d-flex flex-wrap align-items-start justify-content-between gap-2">
                    <h2 class="h5 fw-bold mb-0">برامج الحملات</h2>
                    <div class="programmes-total text-start results-total" id="results-total"></div>
                  </div>
                </div>
              </div>

              <!-- Filters -->
              <section class="results-filters mb-3" aria-label="Filtres">
                <div class="results-filters-shell">
                  <div class="results-filters-section results-filters-section--primary">
                    <div class="results-filters-row">
                      <div class="results-filter-compact">
                        <label class="form-label mb-1" for="filter-br">رقم المكتب</label>
                        <input type="text" class="form-control form-control-sm" id="filter-br" placeholder="" inputmode="numeric" />
                      </div>
                      <div class="results-filter-compact results-filter-compact--type">
                        <label class="form-label mb-1" for="filter-type">نوع الحملة</label>
                        <select class="form-select form-select-sm" id="filter-type">
                          <option value=""></option>
                          <option value="قطاعية">قطاعية</option>
                          <option value="جغرافية">جغرافية</option>
                          <option value="لا شيء">لا شيء</option>
                        </select>
                      </div>
                      <div class="results-filter-compact">
                        <label class="form-label mb-1" for="filter-zone">نوع النشاط / المنطقة الجغرافية</label>
                        <input type="text" class="form-control form-control-sm" id="filter-zone" placeholder="..." />
                      </div>
                      <div class="results-filter-actions">
                        <button type="button" class="btn btn-outline-secondary btn-sm" id="btn-filters-reset">إلغاء</button>
                      </div>
                    </div>
                  </div>
                  <div class="results-export-toolbar" aria-label="Téléchargements">
                    <button type="button" class="btn btn-outline-success btn-sm" id="btn-export-xlsx">Excel</button>
                    <button type="button" class="btn btn-outline-danger btn-sm" id="btn-export-pdf">PDF</button>
                  </div>
                </div>
              </section>

              <!-- Table -->
              <div class="table-responsive composed-table-wrap flex-grow-1 results-table-wrap is-loading" id="results-table-wrap">
                <table class="table table-hover align-middle composed-table results-table mb-0" dir="rtl">
                  <thead id="results-thead"></thead>
                  <tbody id="results-tbody"></tbody>
                </table>
                <div class="results-table-loader" id="results-table-loader" aria-hidden="false">
                  <div class="spinner-border text-success" role="status" aria-label="Chargement"></div>
                </div>
              </div>
              <div class="programmes-pagination d-none" id="results-pagination">
                <div class="programmes-pagination-row">
                  <button type="button" class="btn btn-outline-secondary btn-sm programmes-page-btn composed-menu-btn" id="res-prev">الصفحة السابقة</button>
                  <div class="programmes-pages" id="res-pages"></div>
                  <button type="button" class="btn btn-outline-secondary btn-sm programmes-page-btn composed-menu-btn" id="res-next">الصفحة التالية</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/@tanstack/table-core@8.5.20/build/umd/index.production.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/interface3.js"></script>
  </body>
</html>
