<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion</title>
    <link rel="icon" href="images/cnss_logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body class="page-login">
    <div class="composed-backdrop" aria-hidden="true"></div>
    <div class="composed-grid-pattern" aria-hidden="true"></div>

    <main class="container login-shell">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card login-card">
            <div class="login-card-accent" aria-hidden="true"></div>
            <div class="card-body p-4 p-lg-4">
              <div class="d-flex align-items-center gap-3 mb-4">
                <img src="images/cnss_logo.svg" width="52" height="52" alt="" class="login-logo" />
                <div>
                  <h1 class="h5 fw-bold mb-1">Connexion</h1>
                </div>
              </div>

              <div class="alert alert-danger d-none" id="login-error" role="alert"></div>

              <form id="login-form" novalidate>
                <div class="mb-3">
                  <label for="login-matricule" class="form-label">Matricule</label>
                  <input type="text" class="form-control" id="login-matricule" autocomplete="username" required />
                </div>
                <div class="mb-3">
                  <label for="login-pw" class="form-label">Mot de passe</label>
                  <input type="password" class="form-control" id="login-pw" autocomplete="current-password" required />
                </div>
                <button type="submit" class="btn btn-primary w-100" id="login-submit">
                  <span id="login-submit-text">Se connecter</span>
                  <span class="spinner-border spinner-border-sm ms-2 d-none" id="login-submit-spinner" role="status" aria-hidden="true"></span>
                  <span class="visually-hidden" id="login-submit-spinner-label">Chargement…</span>
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
